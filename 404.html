<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page Not Found | Vipul Rathod</title>
    <meta name="robots" content="noindex, follow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .wrap { max-width: 520px; }
        .code {
            font-size: clamp(5rem, 20vw, 9rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
        p { color: #94a3b8; margin-bottom: 2rem; line-height: 1.7; }
        a.btn {
            display: inline-block;
            padding: 0.9rem 2rem;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #22d3ee);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease;
        }
        a.btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has moved. Let's get you back to Vipul Rathod's portfolio.</p>
        <a class="btn" href="/">Back to Home</a>
    </div>
</body>
</html>
